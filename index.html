    <script>
      (function() {
        try {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
              for (let registration of registrations) {
                if (window.location.hostname.includes('ais-dev') || (registration.active && registration.active.scriptURL.includes('firebase-messaging-sw'))) {
                  registration.unregister();
                }
              }
            }).catch(function() {});
          }
          if ('caches' in window && window.location.hostname.includes('ais-dev')) {
            caches.keys().then(function(names) {
              for (let name of names) {
                caches.delete(name);
              }
            }).catch(function() {});
          }
          const cached = localStorage.getItem('voxa_company_settings') || localStorage.getItem('lockdown_company_settings');
          if (cached) {
            const settings = JSON.parse(cached);
            const targetUrl = settings.faviconUrl || settings.logoUrl;
            if (targetUrl) {
              const link = document.querySelector("link[rel*='icon']");
              if (link) {
                link.href = targetUrl;
                let type = 'image/png';
                const lowerUrl = targetUrl.toLowerCase();
                if (lowerUrl.includes('.ico')) type = 'image/x-icon';
                else if (lowerUrl.includes('.svg')) type = 'image/svg+xml';
                else if (lowerUrl.includes('.webp')) type = 'image/webp';
                else if (lowerUrl.includes('.jpg') || lowerUrl.includes('.jpeg')) type = 'image/jpeg';
                link.type = type;
              }
            }
          }
        } catch (e) {
          console.warn('Favicon early sync failed:', e);
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700;800;900&family=Orbitron:wght@400;600;800;900&display=swap" rel="stylesheet">
